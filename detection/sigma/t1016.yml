title: Network Interface Configuration Discovery (APT Simulator T1016)
id: a1016000-0000-0000-0000-000000001016
status: experimental
description: "Detects enumeration of network interface configuration \u2014 a common\
  \ APT recon step before lateral movement."
references:
- https://attack.mitre.org/techniques/T1016
tags:
- attack.discovery
- attack.t1016
logsource:
  category: process_creation
detection:
  selection_win:
    Image|endswith:
    - \ipconfig.exe
  selection_posix:
    CommandLine|contains:
    - ifconfig
    - ip addr
  condition: 1 of selection_*
falsepositives:
- IT inventory scripts
- DHCP diagnostic tools
- monitoring agents
level: low
