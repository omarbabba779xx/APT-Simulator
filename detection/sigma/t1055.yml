title: Suspicious Process Injection Target Enumeration (APT Simulator T1055)
id: b1055000-0000-0000-0000-000000001055
status: experimental
description: Detects OpenProcess calls or process-list enumeration targeting high-value
  processes (lsass, explorer, svchost), a common precursor to process injection.
references:
- https://attack.mitre.org/techniques/T1055
tags:
- attack.defense_evasion
- attack.privilege_escalation
- attack.t1055
logsource:
  category: process_access
  product: windows
detection:
  selection:
    TargetImage|endswith:
    - \lsass.exe
    - \explorer.exe
    - \svchost.exe
    - \winlogon.exe
    GrantedAccess|contains:
    - '0x1010'
    - '0x1038'
    - '0x1fffff'
  filter_legitimate:
    SourceImage|endswith:
    - \MsMpEng.exe
    - \svchost.exe
    - \csrss.exe
  condition: selection and not filter_legitimate
falsepositives:
- AV/EDR products legitimately reading process memory
level: high
