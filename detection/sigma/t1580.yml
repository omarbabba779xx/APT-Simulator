title: AWS Cloud Discovery API Burst (APT Simulator T1580)
id: a1580000-0000-0000-0000-000000001580
status: experimental
description: Detects bursts of read-only AWS discovery API calls (DescribeInstances,
  ListBuckets) from one principal.
references:
- https://attack.mitre.org/techniques/T1580
tags:
- attack.discovery
- attack.t1580
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName:
    - DescribeInstances
    - ListBuckets
    - GetCallerIdentity
    readOnly: true
  condition: selection
falsepositives:
- IaC tooling
- Inventory scanners
level: low
