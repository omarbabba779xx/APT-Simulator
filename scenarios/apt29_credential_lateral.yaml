name: apt29_credential_lateral
description: >
  APT29-style credential harvesting followed by lateral movement —
  enumerate injection targets, brute-force auth markers, enumerate SMB admin shares,
  probe RDP, archive collected data, then exfil over alt protocol.
  Mirrors Cozy Bear post-compromise pivot patterns.
target_platforms: [windows]
actor: APT29-style (emulation)
tags: [apt29, credential_access, lateral_movement, collection, exfiltration, windows]

steps:
  # --- Discovery ---
  - id: sys_info
    ttp: T1082
    params: {}

  - id: user_discovery
    ttp: T1033
    params: {}
    depends_on: [sys_info]

  - id: process_discovery
    ttp: T1057
    params: {}
    depends_on: [sys_info]

  # --- Credential access ---
  - id: credential_targets
    ttp: T1003
    params: {}
    depends_on: [process_discovery]

  - id: injection_target_enum
    ttp: T1055
    params:
      extra_targets: ["MsMpEng.exe"]
    depends_on: [process_discovery]

  - id: brute_force_sim
    ttp: T1110
    params:
      attempts: 30
      usernames: ["administrator", "svc_backup", "svc_sql", "helpdesk"]
      src_ip: "198.51.100.42"
    depends_on: [user_discovery]

  # --- Defense evasion ---
  - id: obfuscate_payload
    ttp: T1027
    params:
      size_bytes: 4096
    depends_on: [credential_targets]

  # --- Lateral movement ---
  - id: smb_share_enum
    ttp: T1021.002
    params:
      hosts: ["127.0.0.1"]
    depends_on: [credential_targets]

  - id: rdp_probe
    ttp: T1021.001
    params:
      hosts: ["127.0.0.1"]
    depends_on: [credential_targets]

  # --- Collection ---
  - id: collect_local_files
    ttp: T1005
    params:
      paths: ["%USERPROFILE%/Documents"]
      max_depth: 2
    depends_on: [smb_share_enum]

  - id: archive_data
    ttp: T1560
    params: {}
    depends_on: [collect_local_files]

  # --- C2 beacon ---
  - id: c2_beacon
    ttp: T1071.001
    params:
      url: http://127.0.0.1:8765/healthz
      beacons: 3
      interval_seconds: 1
      jitter_seconds: 0.3
    depends_on: [obfuscate_payload, archive_data]

  # --- Exfiltration ---
  - id: exfil_dns
    ttp: T1048
    params:
      protocol: dns-txt
      payload_bytes: 512
    depends_on: [archive_data, c2_beacon]

  # --- Indicator cleanup ---
  - id: delete_indicators
    ttp: T1070.004
    params: {}
    depends_on: [exfil_dns]
