name: validated_sandworm_linux_cleanup_path
description: Fixture-backed Sandworm noisy actor-chain covering linux stealth telemetry
  with dry-run markers.
target_platforms:
- linux
actor: Sandworm
tags:
- validated
- actor_chain
- noisy
- sandworm
- linux
- stealthy
- endpoint
- c2
steps:
- id: s01_local_accounts
  ttp: T1087.001:LINUX_LOCAL_ACCOUNT_DISCOVERY
  params:
    dry_run: true
    scenario: validated_sandworm_linux_cleanup_path
- id: s02_system_info
  ttp: T1082
  params:
    dry_run: true
    scenario: validated_sandworm_linux_cleanup_path
  depends_on:
  - s01_local_accounts
- id: s03_process_discovery
  ttp: T1057
  params:
    dry_run: true
    scenario: validated_sandworm_linux_cleanup_path
  depends_on:
  - s02_system_info
- id: s04_history_suppression
  ttp: T1059.004:LINUX_SHELL_HISTORY_DISABLE
  params:
    dry_run: true
    scenario: validated_sandworm_linux_cleanup_path
  depends_on:
  - s03_process_discovery
- id: s05_cron_marker
  ttp: T1053.003:LINUX_CRON_MARKER
  params:
    dry_run: true
    scenario: validated_sandworm_linux_cleanup_path
  depends_on:
  - s04_history_suppression
- id: s06_tool_transfer
  ttp: T1105:LINUX_CURL_TOOL_TRANSFER
  params:
    dry_run: true
    scenario: validated_sandworm_linux_cleanup_path
  depends_on:
  - s05_cron_marker
- id: s07_obfuscation
  ttp: T1027
  params:
    dry_run: true
    scenario: validated_sandworm_linux_cleanup_path
  depends_on:
  - s06_tool_transfer
- id: s08_http_c2
  ttp: T1071.001
  params:
    dry_run: true
    scenario: validated_sandworm_linux_cleanup_path
    url: http://127.0.0.1:8765/healthz
    beacons: 2
  depends_on:
  - s07_obfuscation
- id: s09_archive
  ttp: T1560
  params:
    dry_run: true
    scenario: validated_sandworm_linux_cleanup_path
  depends_on:
  - s08_http_c2
- id: s10_log_clear
  ttp: T1070.004:LINUX_LOG_CLEAR
  params:
    dry_run: true
    scenario: validated_sandworm_linux_cleanup_path
  depends_on:
  - s09_archive
