name: validated_windows_ad_kerberos_lateral
description: >
  Fixture-backed Windows Active Directory lateral movement chain with domain
  login, account and group discovery, password policy discovery, credential
  markers, RDP/SMB/WinRM paths, registry change, and service creation.
target_platforms: [windows]
actor: Enterprise Lab
tags: [validated, actor_chain, realistic, active_directory, windows, lateral_movement]

steps:
  - id: s01_domain_login
    ttp: T1078.002:AD_DOMAIN_ACCOUNT_LOGIN
    params: {dry_run: true, principal: lab.enterprise}

  - id: s02_user_discovery
    ttp: T1033:AD_USER_DISCOVERY
    params: {dry_run: true, principal: lab.enterprise}
    depends_on: [s01_domain_login]

  - id: s03_account_enum
    ttp: T1087.002:AD_DOMAIN_ACCOUNT_ENUM
    params: {dry_run: true, principal: lab.enterprise}
    depends_on: [s02_user_discovery]

  - id: s04_group_enum
    ttp: T1069.002:AD_DOMAIN_GROUP_ENUM
    params: {dry_run: true, principal: lab.enterprise}
    depends_on: [s03_account_enum]

  - id: s05_password_policy
    ttp: T1201:AD_PASSWORD_POLICY_DISCOVERY
    params: {dry_run: true, principal: lab.enterprise}
    depends_on: [s04_group_enum]

  - id: s06_sam_access
    ttp: T1003.002:AD_SAM_ACCESS_MARKER
    params: {dry_run: true, principal: lab.enterprise}
    depends_on: [s05_password_policy]

  - id: s07_rdp_lateral
    ttp: T1021.001:AD_RDP_LATERAL_PATH
    params: {dry_run: true, principal: lab.enterprise}
    depends_on: [s06_sam_access]

  - id: s08_smb_lateral
    ttp: T1021.002:AD_SMB_ADMIN_SHARE_PATH
    params: {dry_run: true, principal: lab.enterprise}
    depends_on: [s06_sam_access]

  - id: s09_winrm_lateral
    ttp: T1021.006:AD_WINRM_LATERAL_PATH
    params: {dry_run: true, principal: lab.enterprise}
    depends_on: [s06_sam_access]

  - id: s10_registry_policy
    ttp: T1112:AD_REGISTRY_POLICY_CHANGE
    params: {dry_run: true, principal: lab.enterprise}
    depends_on: [s07_rdp_lateral, s08_smb_lateral, s09_winrm_lateral]

  - id: s11_service_create
    ttp: T1543.003:AD_WINDOWS_SERVICE_CREATE
    params: {dry_run: true, principal: lab.enterprise}
    depends_on: [s10_registry_policy]
