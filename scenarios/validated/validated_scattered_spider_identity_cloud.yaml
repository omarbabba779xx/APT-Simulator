name: validated_scattered_spider_identity_cloud
description: >
  Fixture-backed Scattered Spider-style chain centered on identity pressure,
  SaaS token persistence, cloud console access, role assignment, and SaaS data
  exposure markers.
target_platforms: [windows, linux, darwin]
actor: Scattered Spider
tags: [validated, actor_chain, noisy, scattered_spider, identity, saas, cloud]

steps:
  - id: s01_password_spray
    ttp: T1110.003:M365_PASSWORD_SPRAY
    params: {dry_run: true}

  - id: s02_mfa_policy_change
    ttp: T1556.009:OKTA_MFA_POLICY_WEAKEN
    params: {dry_run: true}
    depends_on: [s01_password_spray]

  - id: s03_risky_signin
    ttp: T1078.004:IDENTITY_RISKY_SIGNIN
    params: {dry_run: true}
    depends_on: [s02_mfa_policy_change]

  - id: s04_entra_app_role
    ttp: T1098.003:ENTRA_APP_ROLE_GRANT
    params: {dry_run: true}
    depends_on: [s03_risky_signin]

  - id: s05_saas_token
    ttp: T1098.005:SAAS_TOKEN_CREATED
    params: {dry_run: true}
    depends_on: [s04_entra_app_role]

  - id: s06_cloud_console
    ttp: T1078.004:AZURE_PORTAL_RISKY_SIGNIN
    params: {dry_run: true, principal: lab.scattered}
    depends_on: [s03_risky_signin]

  - id: s07_role_assignment
    ttp: T1098.003:AZURE_ROLE_ASSIGNMENT
    params: {dry_run: true}
    depends_on: [s06_cloud_console]

  - id: s08_group_enum
    ttp: T1087.004:M365_GROUP_ENUMERATION
    params: {dry_run: true}
    depends_on: [s05_saas_token]

  - id: s09_drive_download
    ttp: T1530:GOOGLE_DRIVE_BULK_DOWNLOAD
    params: {dry_run: true}
    depends_on: [s08_group_enum]

  - id: s10_external_share
    ttp: T1567.002:SAAS_EXTERNAL_SHARE
    params: {dry_run: true}
    depends_on: [s09_drive_download]
