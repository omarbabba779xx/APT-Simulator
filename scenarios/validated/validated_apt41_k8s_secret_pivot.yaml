name: validated_apt41_k8s_secret_pivot
description: Fixture-backed APT41 stealthy actor-chain covering cloud k8s telemetry
  with dry-run markers.
target_platforms:
- linux
actor: APT41
tags:
- validated
- actor_chain
- stealthy
- apt41
- cloud
- kubernetes
- container
- realistic
steps:
