name: validated_lazarus_dev_saas_exfil
description: Fixture-backed Lazarus stealthy actor-chain covering identity saas telemetry
  with dry-run markers.
target_platforms:
- windows
- linux
- darwin
actor: Lazarus
tags:
- validated
- actor_chain
- stealthy
- lazarus
- identity
- saas
- cloud
- realistic
steps:
- id: s01_password_spray
  ttp: T1110.003:M365_PASSWORD_SPRAY
  params:
    dry_run: true
    scenario: validated_lazarus_dev_saas_exfil
    principal: validated_lazarus_dev_saas_exfil@lab.local
- id: s02_mfa_policy_change
  ttp: T1556.009:OKTA_MFA_POLICY_WEAKEN
  params:
    dry_run: true
    scenario: validated_lazarus_dev_saas_exfil
    principal: validated_lazarus_dev_saas_exfil@lab.local
