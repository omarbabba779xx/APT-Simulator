orchestrator:
  host: 127.0.0.1
  port: 8000
  audit_dir: data/audit
  scenarios_dir: scenarios
  db_path: data/apt_sim.db
  killswitch_file: data/STOP
  lab_evidence_path: data/lab_evidence.jsonl
  backup_dir: data/backups
  retention_days: 90
  cloud_sandbox_profiles_path: config/cloud_sandbox_profiles.yaml

agent:
  beacon_interval_seconds: 5
  beacon_jitter_seconds: 2
  ttl_seconds: 14400
  max_consecutive_failures: 5

security:
  require_signed_payloads: true
  signing_key_path: keys/ed25519_private.pem
  signing_pub_path: keys/ed25519_public.pem
  enforce_lab_whitelist: true
  require_auth: false
  jwt_secret_path: keys/jwt_secret.bin
  jwt_algorithm: HS256
  secrets_provider: local_file
  secrets_env_prefix: APT_SIM_
  vault_addr_env: VAULT_ADDR
  aws_secret_id_env: APT_SIM_AWS_SECRET_ID
  azure_keyvault_url_env: AZURE_KEYVAULT_URL
  gcp_secret_name_env: APT_SIM_GCP_SECRET_NAME
  sso_enabled: false
  sso_provider: oidc
  oidc_issuer: ""
  oidc_audience: ""
  oidc_jwks_url: ""
  oidc_jwks_path: ""
  rbac_role_claim: role
  rbac_role_map: {}
  agent_mtls_enabled: false
  agent_client_ca_path: ""
  agent_heartbeat_stale_seconds: 300

logging:
  level: INFO
  json: true
  file: data/logs/apt_sim.jsonl
