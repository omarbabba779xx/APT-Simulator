<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>APT Simulator — Console</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>APT Simulator</h1>
    <div class="status-bar">
      <span id="health-badge" class="badge unknown">●</span>
      <span id="health-text">checking...</span>
      <span class="grow"></span>
      <button id="killswitch-btn" class="danger">ENGAGE KILLSWITCH</button>
    </div>
  </header>

  <main>
    <section>
      <h2>Agents</h2>
      <table id="agents-table">
        <thead><tr><th>ID</th><th>Hostname</th><th>Platform</th><th>PID</th><th>Last Seen</th></tr></thead>
        <tbody></tbody>
      </table>
      <p class="muted" id="agents-empty" hidden>No agents registered.</p>
    </section>

    <section>
      <h2>Scenarios</h2>
      <div id="scenarios-list" class="card-grid"></div>
    </section>

    <section>
      <h2>Runs</h2>
      <table id="runs-table">
        <thead><tr><th>ID</th><th>Scenario</th><th>Status</th><th>Started</th><th>Steps</th></tr></thead>
        <tbody></tbody>
      </table>
      <p class="muted" id="runs-empty" hidden>No runs yet. Trigger a scenario above.</p>
    </section>

    <section>
      <h2>MITRE ATT&amp;CK Coverage</h2>
      <div id="coverage-matrix"></div>
    </section>

    <section>
      <h2>Live Event Feed</h2>
      <div id="event-feed" class="event-feed"></div>
    </section>
  </main>

  <div id="step-modal" class="modal" hidden>
    <div class="modal-box">
      <div class="modal-header">
        <span id="modal-title">Run Detail</span>
        <button id="modal-close" onclick="document.getElementById('step-modal').hidden=true">✕</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <footer>
    <small>
      Defensive emulation — lab use only. Refresh interval: 3s.
      <a href="/docs" target="_blank">API docs</a>
    </small>
  </footer>

  <script src="app.js"></script>
</body>
</html>
