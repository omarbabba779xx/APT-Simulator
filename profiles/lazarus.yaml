name: Lazarus Group
aliases: [HIDDEN COBRA, Guardians of Peace, APT38, BlueNoroff, Andariel]
origin: North Korea
sponsor: RGB (Reconnaissance General Bureau)
motivation: financial_crime, espionage, disruption
active_since: 2009
description: >
  North Korean state-sponsored threat actor conducting financially-motivated
  attacks (cryptocurrency theft, SWIFT fraud) and destructive campaigns.
  Responsible for WannaCry, Sony Pictures hack, and numerous cryptocurrency
  exchange breaches.

preferred_ttps:
  - T1033   # User Discovery
  - T1082   # System Info Discovery
  - T1016   # Network Config Discovery
  - T1049   # Network Connections Discovery
  - T1057   # Process Discovery
  - T1069.001  # Local Groups
  - T1083   # File Discovery
  - T1005   # Data from Local System
  - T1003   # Credential Access
  - T1027   # Obfuscation
  - T1105   # Ingress Tool Transfer
  - T1547.001  # Registry Run Key
  - T1053.005  # Scheduled Task
  - T1071.001  # HTTP C2
  - T1041   # Exfiltration over C2
  - T1486   # Data Encrypted for Impact
  - T1070.004  # Indicator Removal

c2_profile:
  jitter_mode: uniform
  interval_seconds: 120
  jitter_seconds: 60
  profile: default
  user_agent_rotation: false

evasion_preference: [T1027, T1070.004]
persistence_preference: [T1547.001, T1053.005]

target_platforms: [windows]
tags: [northkorea, rgb, financial, destructive, wannacry, swift]
