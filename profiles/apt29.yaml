name: APT29
aliases: [Cozy Bear, The Dukes, Midnight Blizzard, NOBELIUM, Dark Halo]
origin: Russia
sponsor: SVR (Foreign Intelligence Service)
motivation: espionage
active_since: 2008
description: >
  Russian state-sponsored APT linked to SVR. Known for stealthy long-term
  intrusions, supply-chain attacks (SolarWinds), and spear-phishing against
  governments, think-tanks, and technology companies.

preferred_ttps:
  - T1033   # User Discovery
  - T1082   # System Information Discovery
  - T1057   # Process Discovery
  - T1083   # File Discovery
  - T1016   # Network Config Discovery
  - T1003   # Credential Access
  - T1027   # Obfuscation
  - T1547.001  # Registry Run Key
  - T1071.001  # HTTP C2
  - T1105   # Ingress Tool Transfer
  - T1070.004  # Indicator Removal

c2_profile:
  jitter_mode: exponential
  interval_seconds: 3600       # 1-hour beacon — very slow/stealthy
  jitter_seconds: 600
  profile: stealth
  user_agent_rotation: true
  sleep_windows:
    - { start_hour: 0, end_hour: 6 }   # silent overnight

evasion_preference: [T1027, T1070.004]
persistence_preference: [T1547.001]

target_platforms: [windows]
tags: [russia, svr, espionage, stealthy, long-dwell]
