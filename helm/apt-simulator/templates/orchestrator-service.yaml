apiVersion: v1
kind: Service
metadata:
  name: {{ include "apt-simulator.orchestrator.name" . }}
  labels:
    {{- include "apt-simulator.labels" . | nindent 4 }}
    component: orchestrator
spec:
  type: {{ .Values.orchestrator.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "apt-simulator.name" . }}
    component: orchestrator
  ports:
    - name: http
      port: {{ .Values.orchestrator.service.port }}
      targetPort: http
