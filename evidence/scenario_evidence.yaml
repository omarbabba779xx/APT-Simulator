    success_criteria:
      - Impact stages are marker-only.
      - Account removal is a detection marker, not a real directory change.
      - Cleanup follows the synthetic impact signal.
  - scenario: validated_cloud_k8s_takeover_path
    validation_status: fixture-backed
    confidence: high
    telemetry_sources: [cloudtrail, cloud_api, metadata, kubernetes_audit, container_runtime]
    expected_detection_count: 10
    fixture: evidence/soc_golden_events.jsonl
    runbook:
      - Start the cloud/Kubernetes path in dry-run mode.
      - Confirm cloud login, service discovery, metadata marker, admin command, Kubernetes discovery, role binding, service creation, and host escape signal.
      - Review cloud and Kubernetes detections together.
    success_criteria:
      - Cloud access precedes Kubernetes activity.
      - Role binding is high-risk and marker-only.
      - Escape signal has no host-level side effect.
  - scenario: validated_windows_ad_kerberos_lateral
    validation_status: fixture-backed
