version: 1
description: Fixture-backed evidence contracts for validated actor-chain scenarios.
scenarios:
  - scenario: validated_apt29_identity_cloud_chain
    validation_status: fixture-backed
    confidence: high
    telemetry_sources: [identity, windows_process, cloud_api, storage, dns, http]
    expected_detection_count: 12
    fixture: evidence/soc_golden_events.jsonl
    runbook:
      - Start the scenario in dry-run mode.
      - Confirm identity sign-in, endpoint discovery, cloud discovery, collection, C2, and exfiltration markers.
      - Compare Sigma matches against the golden event contract.
    success_criteria:
      - All scenario steps are queued without DAG errors.
      - At least one detection event exists for each major phase.
      - No non-lab network or cloud provider call is required.
  - scenario: validated_fin7_pos_lateral_collection
    validation_status: fixture-backed
    confidence: high
    telemetry_sources: [windows_process, windows_security, file_event, http]
    expected_detection_count: 12
    fixture: evidence/soc_golden_events.jsonl
    runbook:
      - Start the Windows scenario in dry-run mode.
      - Confirm execution, persistence, credential pressure, lateral path, collection, and exfiltration markers.
      - Validate that high-risk persistence detections remain visible in the report.
    success_criteria:
      - Service and scheduled task markers are present.
      - SMB and credential markers are ordered after discovery.
      - Exfiltration is loopback or synthetic only.
  - scenario: validated_lazarus_saas_cloud_exfil
    validation_status: fixture-backed
    confidence: high
    telemetry_sources: [process, saas, identity, cloud_api, storage, http]
    expected_detection_count: 12
    fixture: evidence/soc_golden_events.jsonl
    runbook:
      - Start the hybrid scenario in dry-run mode.
      - Confirm SaaS token, repository clone, drive download, cloud storage, external share, and C2 markers.
      - Compare SaaS and cloud detections against exported Sigma metadata.
    success_criteria:
      - SaaS collection and cloud collection both appear.
      - External share follows collection.
      - Cleanup is terminal and marker-only.
  - scenario: validated_apt41_linux_k8s_pivot
    validation_status: fixture-backed
    confidence: high
    telemetry_sources: [linux_process, file_event, kubernetes_audit, container_runtime]
    expected_detection_count: 11
    fixture: evidence/soc_golden_events.jsonl
    runbook:
      - Start the Linux/Kubernetes scenario in dry-run mode.
      - Confirm shell history, cron, tool transfer, Kubernetes discovery, API execution, role binding, and escape markers.
      - Review Kubernetes audit coverage in the detection workbench.
    success_criteria:
      - Kubernetes steps remain marker-only.
      - Secret read and role binding are represented as high-risk detections.
      - Log clear occurs only after the simulated cluster path.
  - scenario: validated_ransomware_ad_preimpact
    validation_status: fixture-backed
    confidence: high
    telemetry_sources: [windows_security, directory_service, windows_process, file_event]
    expected_detection_count: 12
    fixture: evidence/soc_golden_events.jsonl
    runbook:
      - Start the AD ransomware pre-impact scenario in dry-run mode.
      - Confirm domain discovery, credential access, lateral path, GPO change, service creation, staging, and impact markers.
      - Validate impact markers are synthetic and reversible.
    success_criteria:
      - Credential access precedes lateral movement.
      - GPO and service changes are represented by markers only.
      - Impact steps do not modify real business data.
  - scenario: validated_insider_saas_data_access
    validation_status: fixture-backed
    confidence: high
    telemetry_sources: [identity, m365, github, google_workspace, slack, cloudtrail, saas]
    expected_detection_count: 10
    fixture: evidence/soc_golden_events.jsonl
    runbook:
      - Start the insider scenario in dry-run mode.
      - Confirm risky sign-in, token creation, repository clone, drive download, Slack export, cloud read, and external share.
      - Review false-positive risk on common collaboration events.
    success_criteria:
      - SaaS and cloud access are correlated to one principal.
      - External share appears after collection.
      - The scenario contains no destructive step.
  - scenario: validated_turla_stealthy_endpoint_c2
    validation_status: fixture-backed
    confidence: medium
    telemetry_sources: [windows_process, linux_process, registry, http, file_event]
    expected_detection_count: 11
    fixture: evidence/soc_golden_events.jsonl
    runbook:
      - Start the stealth scenario in dry-run mode.
      - Confirm discovery, history suppression, persistence, proxy execution, obfuscation, C2, collection, and cleanup markers.
      - Review low-noise event ordering in the run timeline.
    success_criteria:
      - C2 occurs after obfuscation.
      - Collection occurs after C2 setup.
      - Cleanup is terminal and synthetic.
  - scenario: validated_scattered_spider_identity_cloud
    validation_status: fixture-backed
