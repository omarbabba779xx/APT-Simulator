version: 2
description: Fixture-backed evidence contracts for validated actor-chain scenarios.
scenarios:
- scenario: validated_apt29_cloud_storage_collection
  validation_status: fixture-backed
  confidence: high
  telemetry_sources:
  - cloud_api
  - cloudtrail
  - storage
  - identity
  expected_detection_count: 10
  fixture: evidence/soc_golden_events.jsonl
  sigma_matches:
  - T1078.004
  - T1526
  - T1619
  - T1580
  - T1530
  - T1530
  ecs_fields:
  - '@timestamp'
  - event.dataset
  - event.action
  - host.name
  - user.name
  - process.name
  - source.ip
  - destination.ip
  ocsf_categories:
  - activity
  - identity
  - network
  - system
  siem_fields:
  - attack.technique.id
  - rule.name
  - event.severity
  - observer.vendor
  - related.user
  detection_latency_seconds:
    target: 300
    warning: 900
    critical: 1800
  report_expectations:
  - scenario summary
  - step timeline
  - detection coverage
  - evidence fixtures
  - cleanup status
  runbook:
  - Start scenario in dry-run mode against an authorized lab profile.
  - Confirm ordered step timeline, telemetry datasets, Sigma coverage, and golden
    event matches.
  - Export JSON, HTML, and ZIP reports for SOC review.
  success_criteria:
  - All steps validate as an acyclic DAG.
  - Every step has a registered TTP and a Sigma rule.
  - Golden events include ECS, OCSF, SIEM, latency, and cleanup fields.
  - No non-lab network, cloud, identity, or SaaS provider call is required.
