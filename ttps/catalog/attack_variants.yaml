- id: T1595:ATTACK_VARIANT_001
  attack_id: T1595
  name: Active Scanning Variant 001 Marker
  description: Marker-only ATT&CK variant for Active Scanning; emits deterministic
    synthetic telemetry for detection validation.
  tactic: reconnaissance
  platforms:
  - windows
  - linux
  - darwin
  safety_tier: marker-only
  params_schema:
    principal:
      type: string
      default: lab-user-001
    asset:
      type: string
      default: lab-host-001
  artifact: attack_variant_001.json
  sigma:
    title: Active Scanning Variant 001 Marker
    id: e6c8e9a0-eeee-5e12-a4fa-c5acacc568de
    status: experimental
    description: Detects simulator telemetry for Active Scanning variant 001.
    logsource:
      product: apt_simulator
      category: attack_variant
    detection:
      selection:
        event.dataset: apt_sim.attack_variant
        attack.technique.id: T1595
        apt_sim.variant: attack_variant_001
      condition: selection
    falsepositives:
    - authorized simulator replay
    level: low
  synthetic_events:
  - category: attack_variant
    event.dataset: apt_sim.attack_variant
    event.action: attack_variant_001
    attack.tactic: reconnaissance
    attack.technique.id: T1595
    attack.technique.name: Active Scanning
    apt_sim.variant: attack_variant_001
    user.name: '{principal}'
    host.name: '{asset}'
