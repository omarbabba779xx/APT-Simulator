- id: T1078.002:AD_DOMAIN_ACCOUNT_LOGIN
  attack_id: T1078.002
  name: Domain account login marker
  description: Marker-only active_directory simulation for Domain Accounts.
  tactic: initial_access
  platforms:
  - windows
  safety_tier: marker-only
  metadata:
    provider: active_directory
    telemetry_source: windows_security
    source_model: defensive_lab
    variant_family: ad_enterprise_lab
    mitre_name: Domain Accounts
  params_schema:
    principal:
      type: string
      default: lab.operator
    asset:
      type: string
      default: lab-endpoint-01
    resource:
      type: string
      default: active_directory-resource-01
    source_ip:
      type: string
      default: 198.51.100.77
  artifact: ad_enterprise_lab_ad_domain_account_login.json
  sigma:
    title: Domain account login marker
    id: 38c2551c-4502-50bd-8bf0-9dc3ed17f792
    status: experimental
    description: Detects simulator telemetry for Domain account login marker.
    logsource:
      product: apt_simulator
      category: windows_security
    detection:
      selection:
        event.dataset: apt_sim.ad_enterprise_lab.windows_security
        event.action: '4624'
        attack.technique.id: T1078.002
        apt_sim.variant: ad_domain_account_login
      condition: selection
    falsepositives:
    - authorized simulator replay
    level: medium
  synthetic_events:
  - category: windows_security
    event.dataset: apt_sim.ad_enterprise_lab.windows_security
    event.action: '4624'
    event.provider: active_directory
    attack.tactic: initial_access
    attack.technique.id: T1078.002
    attack.technique.name: Domain Accounts
    apt_sim.variant: ad_domain_account_login
    apt_sim.variant_family: ad_enterprise_lab
    source.ip: '{source_ip}'
    user.name: '{principal}'
    host.name: '{asset}'
    resource.name: '{resource}'
