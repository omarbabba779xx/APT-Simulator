name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy orchestrator agent ttps --ignore-missing-imports
        continue-on-error: true

      - name: Test
        run: pytest -q --tb=short

      - name: Verify Sigma export
        run: |
          python -m orchestrator.sigma_export export
          test -f detection/sigma/coverage.json || (echo "coverage.json missing"; exit 1)
        shell: bash

  smoke-e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate signing keys
        run: python -m orchestrator.core.signer init

      - name: Allow loopback for whitelist
        run: |
          python -c "
          import yaml, pathlib
          p = pathlib.Path('config/lab_whitelist.yaml')
          d = yaml.safe_load(p.read_text())
          d['allow_any'] = True
          p.write_text(yaml.safe_dump(d))
          "

      - name: Start orchestrator
        run: |
          nohup python -m orchestrator.main serve --port 8765 > orchestrator.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/healthz > /dev/null && break
            sleep 1
          done

      - name: Run scenario via REST
        run: |
          nohup python -m agent.main run --server http://127.0.0.1:8765 --interval 1 --jitter 0 --ttl-seconds 60 > agent.log 2>&1 &
          sleep 3
          RUN_ID=$(curl -s -X POST http://127.0.0.1:8765/scenarios/run \
            -H "Content-Type: application/json" \
            -d '{"name":"basic_recon"}' | python -c "import sys,json;print(json.load(sys.stdin)['id'])")
          echo "RUN_ID=$RUN_ID"
          for i in $(seq 1 30); do
            STATUS=$(curl -s http://127.0.0.1:8765/runs/$RUN_ID | python -c "import sys,json;print(json.load(sys.stdin)['status'])")
            echo "[$i] $STATUS"
            [ "$STATUS" = "completed" ] && break
            [ "$STATUS" = "failed" ] && exit 1
            sleep 2
          done
          [ "$STATUS" = "completed" ] || (echo "scenario did not complete in time"; exit 1)

      - name: Verify audit chain
        run: python -m orchestrator.main verify-audit

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            orchestrator.log
            agent.log
            data/audit/audit.jsonl
